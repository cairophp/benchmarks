; The same for every server: opcache on (also for CLI workers), no JIT.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.jit = disable
memory_limit = 256M

; See cairophp/docs mysql.md: the counters take a lock per increment in a thread-safe PHP.
mysqlnd.collect_statistics = 0
